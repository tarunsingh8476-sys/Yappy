
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smart-community-backend

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Neon PostgreSQL
      DB_HOST: ${NEON_DB_HOST}
      DB_PORT: "5432"
      DB_NAME: Yappy
      DB_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # Upstash Redis
      REDIS_URL: ${REDIS_URL}

      PORT: "8080"

      # ML Moderation
      MODERATION_ENDPOINT: https://social-community-app-ml-1.onrender.com/predict

      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # reCAPTCHA
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-false}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}

    restart: unless-stopped
